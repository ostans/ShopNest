{% extends 'base.html' %}
{% block title %}Delete Listing - {{ site_name }}{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <h2 class="mb-3">Delete this listing?</h2>
            <p class="text-muted">{{ object.product.name }} - {{ object.price }}</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger rounded-pill px-4">Yes, delete</button>
                <a href="{% url 'stores:listings' store.slug %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
